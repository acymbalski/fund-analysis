name: Test and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run unit tests
        run: node --test tests/calc.test.js tests/benchmark.test.js

  # GitHub Pages deploys automatically from /docs on the configured branch.
  # This job just records that tests passed before deploy proceeds.
  deploy-ready:
    name: Deploy Ready
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - run: echo "Tests passed — GitHub Pages will serve /docs automatically."
